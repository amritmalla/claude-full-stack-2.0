name: Skill Proposal
description: Propose a new skill before authoring it.
title: "[skill] <kebab-case-name>"
labels: ["skill-proposal"]
body:
  - type: input
    id: name
    attributes:
      label: Proposed name (kebab-case)
      placeholder: safe-migration-plan
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain or implementation category
      options:
        - architecture/idea-development
        - architecture/system-design
        - architecture/backend-architecture
        - architecture/frontend-architecture
        - architecture/mobile-architecture
        - architecture/data-architecture
        - architecture/ai-native-engineering
        - architecture/infrastructure-platform
        - architecture/reliability
        - architecture/security
        - architecture/performance
        - architecture/quality-engineering
        - architecture/operations
        - implementations/backend
        - implementations/frontend
        - implementations/mobile
        - implementations/data
        - implementations/infrastructure
        - implementations/ai
    validations:
      required: true
  - type: textarea
    id: when-to-use
    attributes:
      label: When to use (one paragraph)
      description: When should Claude invoke this skill? Be specific about the trigger.
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Expected outputs
      description: What concrete artifacts will the skill produce?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this skill belongs in the repository
      description: Differentiation, production risk, AI leverage, pain — pick one or more.
    validations:
      required: true
