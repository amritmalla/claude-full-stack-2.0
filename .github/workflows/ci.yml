name: ci
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate skill frontmatter
        run: ./scripts/validate-skills.sh
      - name: Lint markdown
        run: ./scripts/lint-markdown.sh
